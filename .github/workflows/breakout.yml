name: Generate Breakout SVG

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-breakout
  cancel-in-progress: true

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Breakout SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./output/
          enable_ghost_bricks: true
          paddle_color: "#60A5FA"
          ball_color: "#DBEAFE"
          bricks_colors: "#172554,#1E3A8A,#2563EB,#3B82F6,#60A5FA"

      - name: Check generated files
        run: |
          echo "Generated files:"
          find ./output -type f -maxdepth 2 -print

      - name: Publish Breakout SVG
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: github-breakout
          publish_dir: ./output
          force_orphan: true
