name: Generate Contribution Tetris

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-tetris
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Tetris contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: dist/contribution-graph.svg
          tetromino_count: "6"
          palette: "auto"
          animation_duration: "8"

      - name: Make Tetris animation loop forever
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("dist/contribution-graph.svg")

          if not path.exists():
              raise FileNotFoundError(
                  "dist/contribution-graph.svg was not generated"
              )

          svg = path.read_text(encoding="utf-8")

          svg = svg.replace(
              'repeatCount="1"',
              'repeatCount="indefinite"'
          )

          path.write_text(svg, encoding="utf-8")

          print("Tetris animation set to infinite loop.")
          PY

      - name: Deploy SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
