name: Generate Contribution Tetris

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-tetris
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Generate Tetris contribution graph
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: assets/contribution-graph.svg
          tetromino_count: "6"
          palette: "auto"
          animation_duration: "8"

      - name: Make Tetris animation loop forever
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/contribution-graph.svg")

          if not path.exists():
              raise FileNotFoundError(
                  "assets/contribution-graph.svg was not generated"
              )

          svg = path.read_text(encoding="utf-8")

          svg = svg.replace(
              'repeatCount="1"',
              'repeatCount="indefinite"'
          )

          path.write_text(svg, encoding="utf-8")

          print("Tetris animation set to infinite loop.")
          PY

      - name: Commit generated animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/contribution-graph.svg

          if git diff --cached --quiet; then
            echo "No Tetris changes to commit."
            exit 0
          fi

          git commit -m "update contribution tetris"

          echo "Syncing with latest main branch..."

          git pull --rebase origin main

          git push origin HEAD:main
